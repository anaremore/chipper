name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PLUGINVAL_VERSION: '1.0.4'
  PLUGINVAL_WINDOWS_SHA256: 'c08e61ce3b96db41636f8ec7e76f4c7e2c13ebdac7fa1b5a1f52b4f32ec715ab'

jobs:
  build-test:
    name: ${{ matrix.label }} build and test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows
            os: windows-latest
            python: python
            parallel: 2
          - label: Linux
            os: ubuntu-24.04
            python: python3
            parallel: 2
          - label: macOS
            os: macos-14
            python: python3
            parallel: 2

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libasound2-dev \
            libcurl4-openssl-dev \
            libfreetype6-dev \
            libgtk-3-dev \
            libjack-jackd2-dev \
            libglu1-mesa-dev \
            libwebkit2gtk-4.1-dev \
            libx11-dev \
            libxcomposite-dev \
            libxcursor-dev \
            libxext-dev \
            libxinerama-dev \
            libxkbcommon-x11-dev \
            libxrandr-dev \
            libxrender-dev \
            mesa-common-dev \
            xvfb

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify clean checkout
        shell: pwsh
        run: ./scripts/verify-project.ps1 -BuildRoot build-ci -Config Release -Parallel ${{ matrix.parallel }}

      - name: Validate VST3 with pluginval
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'pluginval_Windows.zip'
          $install = Join-Path $env:RUNNER_TEMP 'pluginval'
          $url = "https://github.com/Tracktion/pluginval/releases/download/v$env:PLUGINVAL_VERSION/pluginval_Windows.zip"
          Invoke-WebRequest $url -OutFile $archive
          $actualHash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $env:PLUGINVAL_WINDOWS_SHA256) {
            throw "pluginval archive checksum mismatch: expected $env:PLUGINVAL_WINDOWS_SHA256, got $actualHash"
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $install -Force
          $validator = Get-ChildItem -LiteralPath $install -Recurse -Filter pluginval.exe | Select-Object -ExpandProperty FullName -First 1
          $plugin = Get-ChildItem -LiteralPath (Join-Path (Get-Location) 'build-ci') -Recurse -Filter Chipper.vst3 |
            Where-Object { $_.PSIsContainer } | Select-Object -ExpandProperty FullName -First 1
          if ([string]::IsNullOrWhiteSpace($validator) -or [string]::IsNullOrWhiteSpace($plugin)) {
            throw 'pluginval or the Chipper VST3 bundle was not found'
          }
          $logDirectory = Join-Path $env:RUNNER_TEMP 'pluginval-logs'
          New-Item -ItemType Directory -Path $logDirectory -Force | Out-Null
          $stdoutPath = Join-Path $logDirectory 'stdout.txt'
          $stderrPath = Join-Path $logDirectory 'stderr.txt'
          $pluginvalArguments = @('--validate', $plugin, '--strictness-level', '5', '--skip-gui-tests', '--timeout-ms', '60000', '--output-dir', $logDirectory, '--verbose')
          $validation = Start-Process -FilePath $validator -ArgumentList $pluginvalArguments -Wait -PassThru -WindowStyle Hidden -RedirectStandardOutput $stdoutPath -RedirectStandardError $stderrPath
          Get-Content -LiteralPath $stdoutPath
          Get-Content -LiteralPath $stderrPath
          if ($validation.ExitCode -ne 0) {
            throw "pluginval failed with exit code $($validation.ExitCode)"
          }

  sanitizers:
    name: Linux ASan and UBSan
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install plugin test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libasound2-dev \
            libcurl4-openssl-dev \
            libfreetype6-dev \
            libgtk-3-dev \
            libjack-jackd2-dev \
            libglu1-mesa-dev \
            libwebkit2gtk-4.1-dev \
            libx11-dev \
            libxcomposite-dev \
            libxcursor-dev \
            libxext-dev \
            libxinerama-dev \
            libxkbcommon-x11-dev \
            libxrandr-dev \
            libxrender-dev \
            mesa-common-dev

      - name: Configure sanitizer build
        run: >-
          cmake -S . -B build-sanitizers
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_C_FLAGS='-fsanitize=address,undefined -fno-omit-frame-pointer'
          -DCMAKE_CXX_FLAGS='-fsanitize=address,undefined -fno-omit-frame-pointer'
          -DCMAKE_EXE_LINKER_FLAGS='-fsanitize=address,undefined'

      - name: Build sanitizer targets
        run: cmake --build build-sanitizers --target chipper_processor_midi_cc_smoke chipper_processor_native_motion_smoke chipper_processor_state_concurrency_smoke chipper_opll_math_smoke chipper_render --parallel 2

      - name: Test under sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build-sanitizers --output-on-failure -R 'chipper_processor_midi_cc_smoke|chipper_processor_native_motion_smoke|chipper_processor_state_concurrency_smoke|chipper_opll_math_smoke|chipper_render_nes_smoke|chipper_render_nes_json_assert'

  required:
    name: Required checks
    if: always()
    needs: [build-test, sanitizers]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every platform and sanitizer gate
        env:
          BUILD_RESULT: ${{ needs.build-test.result }}
          SANITIZER_RESULT: ${{ needs.sanitizers.result }}
        run: test "$BUILD_RESULT" = success && test "$SANITIZER_RESULT" = success
